model_list:
  # text/vision
  - model_name: "gpt-oss-20b"
    litellm_params:
      model: "fireworks_ai/accounts/fireworks/models/gpt-oss-20b"
      api_key: "os.environ/FIREWORK_KEY"
    model_info:
      mode: "chat"
      supports_vision: false
      supports_function_calling: false
  - model_name: "gpt-oss-120b"
    litellm_params:
      model: "fireworks_ai/accounts/fireworks/models/gpt-oss-120b"
      api_key: "os.environ/FIREWORK_KEY"
    model_info:
      mode: "chat"
      supports_vision: false
      supports_function_calling: true
  - model_name: "qwen3p6-plus"
    litellm_params:
      model: "fireworks_ai/accounts/fireworks/models/qwen3p6-plus"
      api_key: "os.environ/FIREWORK_KEY"
    model_info:
      mode: "chat"
      supports_vision: true
      supports_function_calling: true

  # Image generation
  - model_name: "black-forest-labs/FLUX.1-schnell"
    litellm_params:
      model: "fal_ai/fal-ai/flux-schnell"
      api_key: "os.environ/FAL_AI_API_KEY"
    model_info:
      mode: "image_generation"

  - model_name: "black-forest-labs/FLUX.1-dev"
    litellm_params:
      model: "fal_ai/fal-ai/flux-dev"
      api_key: "os.environ/FAL_AI_API_KEY"
      # litellm has no name-mapping for "flux-dev", so it would post to bare
      # https://fal.run; pin the real fal endpoint explicitly.
      api_base: "https://fal.run/fal-ai/flux/dev"
    model_info:
      mode: "image_generation"

  - model_name: "black-forest-labs/FLUX.1-pro"
    litellm_params:
      model: "fal_ai/fal-ai/flux-pro/v1.1"
      api_key: "os.environ/FAL_AI_API_KEY"
    model_info:
      mode: "image_generation"

  # Audio
  - model_name: "whisper-v3-turbo"
    litellm_params:
      model: "fireworks_ai/whisper-v3-turbo"
      api_key: "os.environ/FIREWORK_KEY"
      # Fireworks' low-latency "direct" transcription host; litellm appends /v1/audio/transcriptions.
      api_base: "https://audio-turbo.us-virginia-1.direct.fireworks.ai"
    model_info:
      mode: "audio_transcription"

  # Embedding (for conversation search)
  - model_name: "text-embedding-3-small"
    litellm_params:
      model: "text-embedding-3-small"
      api_key: "os.environ/CHATGPT_API_KEY"
    model_info:
      mode: "embedding"

general_settings:
  drop_params: true

litellm_settings:
  drop_params: true
