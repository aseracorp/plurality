name: Debug Docker Build Repro
on:
  workflow_dispatch:
jobs:
  repro:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            CACHEBUST=${{ github.sha }}
          tags: |
            ghcr.io/aseracorp/plurality:debug-${{ github.sha }}-amd64
          cache-from: type=gha,scope=aseracorp/plurality-amd64
          cache-to: type=gha,scope=aseracorp/plurality-amd64,mode=max
