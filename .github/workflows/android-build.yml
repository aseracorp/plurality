name: Android Build

on:
  push:
    branches: [ master ]
    paths:
      - 'client/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: 'stable'

      - name: Verify signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=0
          for v in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD:STORE_PASSWORD ANDROID_KEY_PASSWORD:KEY_PASSWORD ANDROID_KEY_ALIAS:KEY_ALIAS; do
            name="${v%%:*}"; var="${v##*:}"
            if [ -z "${!var}" ]; then echo "::error::Missing secret: ${name/KEYSTORE_BASE64/ANDROID_KEYSTORE_BASE64}"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set the required Android signing secrets in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All Android signing secrets are present."

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > client/android/app/upload-keystore.jks
          # Fail fast if the decoded keystore can't be opened with the provided alias/password
          keytool -list \
            -keystore client/android/app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          echo "Keystore decoded and opened successfully."

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > client/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android APK
        run: |
          cd client
          flutter pub get
          flutter build apk --release

      - name: Collect APK
        run: |
          mkdir -p downloads/android
          cp client/build/app/outputs/flutter-apk/app-release.apk \
            downloads/android/plurality-android-latest.apk

      - name: Read app version
        id: appversion
        run: |
          VERSION=$(grep '^version:' client/pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appversion.outputs.version }}
          name: v${{ steps.appversion.outputs.version }}
          fail_on_unmatched_files: false
          files: downloads/android/plurality-android-latest.apk
