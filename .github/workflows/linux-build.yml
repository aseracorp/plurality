name: Linux Build

on:
  push:
    branches: [ master ]
    paths:
      - 'client/**'
      - '.github/workflows/linux-build.yml'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
      
      - name: Build Linux app
        run: |
          cd client
          flutter pub get
          flutter build linux --release
          
      - name: Create Linux ZIP package
        run: |
          cd client/build/linux/x64/release/bundle
          zip -r linux-build.zip *
          mkdir -p downloads/linux
          mv linux-build.zip downloads/linux/linux-build.zip
          echo "Linux build package created at downloads/linux/linux-build.zip"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: downloads/linux/
          retention-days: 1
