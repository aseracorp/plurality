name: Linux Build

on:
  push:
    branches: [ master ]
    paths:
      - 'client/**'
      - '.github/workflows/linux-build.yml'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: 'stable'
      
      - name: Build Linux app
        run: |
          cd client
          flutter pub get
          flutter build linux --release
          
      - name: Create Linux ZIP package
        run: |
          # Define the source and target directories using workspace root
          SOURCE_DIR="${{ github.workspace }}/client/build/linux/x64/release/bundle"
          TARGET_DIR="${{ github.workspace }}/downloads/linux"
          ZIP_FILE_NAME="plurality-linux-latest.zip"
          
          # Go into the source directory
          cd "$SOURCE_DIR"
          
          # Create the zip file containing everything in the source directory
          echo "Zipping contents of $SOURCE_DIR..."
          zip -r "$ZIP_FILE_NAME" *
          
          # Create the target directory at the workspace root if it doesn't exist
          echo "Creating target directory $TARGET_DIR..."
          mkdir -p "$TARGET_DIR"
          
          # Move the zip file from the source directory to the target directory
          echo "Moving $ZIP_FILE_NAME to $TARGET_DIR..."
          mv "$ZIP_FILE_NAME" "$TARGET_DIR/$ZIP_FILE_NAME"
          
          echo "✅ Linux build package created at $TARGET_DIR/$ZIP_FILE_NAME"
        shell: bash 


      - name: Read app version
        id: appversion
        run: |
          VERSION=$(grep '^version:' client/pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appversion.outputs.version }}
          name: v${{ steps.appversion.outputs.version }}
          fail_on_unmatched_files: false
          files: downloads/linux/plurality-linux-latest.zip
