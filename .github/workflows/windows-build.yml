on:
  push:
    branches: [ master ]
    paths:
      - 'client/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v1.1
        with:
          vs-version: '17.0'

      - name: Install Windows SDK
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v1
        with:
          sdk-version: 22621
          
      - uses: actions/checkout@v3
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
      
      - name: Build Windows app
        run: |
          cd client
          flutter pub get
          flutter build windows --release
          
      - name: Create Windows installer
        run: |
          choco install nsis -y
          
          # Create NSIS script
          @"
          !include "MUI2.nsh"
          
          Name "Windows Build"
          OutFile "plurality-installer.exe"
          
          InstallDir "$PROGRAMFILES\Windows Build"
          
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          
          !insertmacro MUI_LANGUAGE "English"
          
          Section "Install"
            SetOutPath "$INSTDIR"
            File /r "client\build\windows\runner\Release\*.*"
            
            CreateDirectory "$SMPROGRAMS\Windows Build"
            CreateShortcut "$SMPROGRAMS\Windows Build\Windows Build.lnk" "$INSTDIR\plurality.exe"
            CreateShortcut "$DESKTOP\Windows Build.lnk" "$INSTDIR\plurality.exe"
            
            WriteUninstaller "$INSTDIR\uninstall.exe"
            
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\WindowsBuild" "DisplayName" "Windows Build"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\WindowsBuild" "UninstallString" "$\"$INSTDIR\uninstall.exe$\""
          SectionEnd
          
          Section "Uninstall"
            RMDir /r "$INSTDIR"
            RMDir /r "$SMPROGRAMS\Windows Build"
            Delete "$DESKTOP\Windows Build.lnk"
            
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\WindowsBuild"
          SectionEnd
          "@ | Out-File -FilePath nsis-script.nsi -Encoding utf8
          
          # Build the installer
          makensis nsis-script.nsi
          
          mkdir -p downloads/windows
          cp plurality-installer.exe downloads/windows/plurality-windows-latest.exe
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: downloads/windows/
          retention-days: 1
