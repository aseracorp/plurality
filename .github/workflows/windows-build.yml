name: Windows Build

on:
  push:
    branches: [ master ]
    paths:
      - 'client/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    env: # Define environment variables for the job
      INSTALLER_FILENAME: plurality-windows-latest.exe # <-- Set your desired installer name here
      # flutter_tts still includes <experimental/coroutine>, which recent MSVC
      # toolsets turn into a hard error. The CL var prepends this define to every
      # cl.exe invocation, silencing the deprecation so the build can proceed.
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

    steps:
      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v1.1
        with:
          vs-version: '17.0'

      - name: Install Windows SDK
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v1
        with:
          sdk-version: 22621
          
      - uses: actions/checkout@v3
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: 'stable'
      
      - name: Build Windows app
        run: |
          cd client
          flutter pub get
          flutter build windows --release
          
      - name: Create Windows installer
        run: |
          # Ensure NSIS is installed
          choco install nsis -y

          # Compile the NSIS script
          # Assumes the script is at client/windows/plurality-installer.exe
          # The script's OutFile directive creates plurality-installer.exe in the script's directory
          echo "Compiling NSIS script..."
          # choco installs NSIS here but doesn't add it to PATH, so call it directly.
          & "C:\Program Files (x86)\NSIS\makensis.exe" client/windows/installer.nsi

          # Check if the installer was created successfully (optional but good practice)
          if (-not (Test-Path client/windows/${{ env.INSTALLER_FILENAME }})) {
              echo "Installer file (client/windows/${{ env.INSTALLER_FILENAME }}) not found after running makensis!"
              exit 1
          }

          # Create the downloads directory
          mkdir -p downloads/windows

          # Copy the compiled installer from the script's output location to the downloads directory
          # Adjust the path as necessary based on your NSIS script's OutFile directive
          # This assumes the installer is created in client/windows/${{ env.INSTALLER_FILENAME }}
          cp client/windows/${{ env.INSTALLER_FILENAME }} downloads/windows/${{ env.INSTALLER_FILENAME }}
      
      - name: Read app version
        id: appversion
        run: |
          VERSION=$(grep '^version:' client/pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appversion.outputs.version }}
          name: v${{ steps.appversion.outputs.version }}
          fail_on_unmatched_files: false
          files: downloads/windows/${{ env.INSTALLER_FILENAME }}
