name: Docker Image

# Build a multi-arch Docker image and publish it to the GitHub Container
# Registry (GHCR) on every push to master.
#
# This replaces the legacy CircleCI pipeline (.circleci/config.yml) and
# mirrors its proven design on GitHub Actions:
#   * One job per architecture (linux/amd64, linux/arm64), each with its own
#     isolated `type=gha` cache scope so the two arches never evict each
#     other under GH Actions' 10 GB GHA-layer-cache limit.
#   * A final merge job stitches the per-arch images into a single multi-arch
#     manifest under the consumable tags.
#
# Images are pushed to ghcr.io/aseracorp/plurality (GHCR) instead of Docker
# Hub. Authentication uses the built-in GITHUB_TOKEN with the
# `packages: write` permission — no external registry credentials needed.
#
# Tags pushed:
#   ghcr.io/aseracorp/plurality:<sha>-<arch>   — per-arch intermediates
#   ghcr.io/aseracorp/plurality:<sha>          — multi-arch (consumable)
#   ghcr.io/aseracorp/plurality:<version>      — multi-arch, e.g. 2.0.10
#   ghcr.io/aseracorp/plurality:latest         — multi-arch
#
# The version tag is derived from client/pubspec.yaml (single source of truth,
# e.g. "2.0.10+25"), stripping the "+build" suffix to keep the tag clean.
#
# Caching:
#   * Per-arch `type=gha` layer cache (mode=max) keeps each arch's layers
#     warm between runs without the two arches fighting over the 10 GB limit.
#   * The dockerfile additionally uses BuildKit cache mounts
#     (--mount=type=cache) for the Flutter SDK clone, pub cache, Go module +
#     build caches, and the LiteLLM venv — the heavy dependency installs stay
#     warm even when the GHA layer cache is evicted.

on:
  push:
    branches: [ master ]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: appversion
        run: |
          VERSION=$(grep '^version:' client/pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          # Strip the "+build" suffix so the docker tag stays clean (2.0.10+25 -> 2.0.10)
          VERSION="${VERSION%%+*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using app version: $VERSION"
        shell: bash

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # CACHEBUST = commit sha forces the dockerfile's Go build layer to be
          # RECOMPILED on every push. Without this, the GHA layer cache
          # (cache-to mode=max) + the dockerfile's BuildKit --mount=type=cache
          # for the Go build cache reuse the previous compiled binary, so the
          # published image ships a STALE server binary even though the source
          # is up to date. This was the root cause of the recurring
          # 'still crashing / old binary' issue.
          build-args: |
            CACHEBUST=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
            ${{ env.IMAGE }}:${{ steps.appversion.outputs.version }}-${{ matrix.arch }}
            ${{ env.IMAGE }}:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ github.repository }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ github.repository }}-${{ matrix.arch }},mode=max

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: appversion
        run: |
          VERSION=$(grep '^version:' client/pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          VERSION="${VERSION%%+*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          set -euxo pipefail
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:${{ steps.appversion.outputs.version }}" \
            -t "$IMAGE:latest" \
            "$IMAGE:${{ github.sha }}-amd64" \
            "$IMAGE:${{ github.sha }}-arm64"

      - name: Verify multi-arch manifest
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"
          echo "Published:"
          echo "  $IMAGE:${{ github.sha }}"
          echo "  $IMAGE:${{ steps.appversion.outputs.version }}"
          echo "  $IMAGE:latest"

  # Self-heal: re-point latest + version at the newest COMPLETE sha (a sha
  # that has BOTH amd64 + arm64 per-arch images on GHCR).
  #
  # The merge job above only runs when both arches succeed; arm64 is a cold
  # QEMU build with weak caching, so a single arm64 failure/cache-miss
  # leaves :latest pinned to an old binary while users who force-pull keep
  # getting a stale server. This `if: always()` job runs even when merge
  # fails and re-points the consumable tags to the newest build that has
  # both arches — the same "no stale latest" guarantee #57 added, restored
  # after #58 removed it. Runs on every push; the re-point is a no-op when
  # merge already succeeded.
  self-heal:
    name: Self-heal latest/version tags
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: appversion
        run: |
          VERSION=$(grep '^version:' client/pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          VERSION="${VERSION%%+*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find newest sha with both arches
        id: find-sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # List all package versions (each has its tag list), newest first.
          VERSIONS=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions?per_page=100")
          # Collect per-arch tags; track which 40-hex shas have both arches.
          python3 - "$VERSIONS" <<'PY'
          import json, sys, re
          versions = json.loads(sys.argv[1])
          arch_of = {}   # sha -> set of arch
          for v in versions:
              for tag in v.get('metadata', {}).get('container', {}).get('tags', []):
                  m = re.fullmatch(r'([0-9a-f]{40})-(amd64|arm64)', tag)
                  if m:
                      arch_of.setdefault(m.group(1), set()).add(m.group(2))
          for sha in sorted(arch_of, key=lambda s: next((v['updated_at'] for v in versions if any(t.startswith(s) for t in v.get('metadata',{}).get('container',{}).get('tags',[]))), ''), reverse=True):
              if arch_of[sha] >= {'amd64','arm64'}:
                  print(f"NEWEST_SHA={sha}")
                  break
          else:
              print("NEWEST_SHA=")
          PY
          echo "NEWEST_SHA=${NEWEST_SHA:-}"
          if [ -z "${NEWEST_SHA:-}" ]; then
            echo "No complete sha found on GHCR yet; nothing to heal."
            exit 0
          fi
          echo "sha=$NEWEST_SHA" >> "$GITHUB_OUTPUT"

      - name: Re-point latest/version at newest complete sha
        if: steps.find-sha.outputs.sha != ''
        run: |
          set -euxo pipefail
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ steps.appversion.outputs.version }}" \
            -t "$IMAGE:${{ steps.find-sha.outputs.sha }}" \
            "$IMAGE:${{ steps.find-sha.outputs.sha }}-amd64" \
            "$IMAGE:${{ steps.find-sha.outputs.sha }}-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"


