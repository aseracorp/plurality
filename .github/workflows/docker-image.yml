name: Docker Image

# Build a multi-arch Docker image and publish it to the GitHub Container
# Registry (GHCR) on every push to master.
#
# This replaces the legacy CircleCI pipeline (.circleci/config.yml). Notable
# differences vs CircleCI:
#   * Images are pushed to ghcr.io/aseracorp/plurality (GHCR) instead of
#     Docker Hub. Authentication uses the built-in GITHUB_TOKEN with the
#     `packages: write` permission — no external registry credentials needed.
#   * A single buildx job builds both linux/amd64 and linux/arm64 and pushes
#     one multi-arch manifest, so consumers pull the right arch automatically.
#
# Tags pushed (all multi-arch):
#   ghcr.io/aseracorp/plurality:<sha>         — unique per commit
#   ghcr.io/aseracorp/plurality:<version>     — e.g. 2.0.10 (from pubspec)
#   ghcr.io/aseracorp/plurality:latest
#
# The version tag is derived from client/pubspec.yaml (single source of truth,
# e.g. "2.0.10+25"), stripping the "+build" suffix to keep the tag clean.

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: appversion
        run: |
          VERSION=$(grep '^version:' client/pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          # Strip the "+build" suffix so the docker tag stays clean (2.0.10+25 -> 2.0.10)
          VERSION="${VERSION%%+*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using app version: $VERSION"
        shell: bash

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=${{ steps.appversion.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Plurality
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max