name: macOS Build

on:
  push:
    branches: [ master ]
    paths:
      - 'client/**'
      - '.github/workflows/macos-build.yml'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: 'stable'
      
      - name: Build macOS app
        run: |
          cd client
          flutter pub get
          flutter build macos --release
          
      - name: Create macOS package
        run: |
          # `flutter build macos` produces a .app bundle, not a .dmg, so build
          # the disk image ourselves from the bundle.
          APP_PATH="client/build/macos/Build/Products/Release/plurality.app"
          mkdir -p downloads/macos
          hdiutil create \
            -volname "Plurality" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            downloads/macos/plurality-macos-latest.dmg
      
      - name: Read app version
        id: appversion
        run: |
          VERSION=$(grep '^version:' client/pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appversion.outputs.version }}
          name: v${{ steps.appversion.outputs.version }}
          fail_on_unmatched_files: false
          files: downloads/macos/plurality-macos-latest.dmg
