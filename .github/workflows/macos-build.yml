name: macOS Build

on:
  push:
    branches: [ master ]
    paths:
      - 'client/**'
      - '.github/workflows/macos-build.yml'

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: 'stable'
      
      - name: Build macOS app
        run: |
          cd client
          flutter pub get
          flutter build macos --release
          
      - name: Create macOS package
        run: |
          # `flutter build macos` produces a .app bundle, not a .dmg, so build
          # the disk image ourselves from the bundle.
          APP_PATH="client/build/macos/Build/Products/Release/plurality.app"
          mkdir -p downloads/macos
          hdiutil create \
            -volname "Plurality" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            downloads/macos/plurality-macos-latest.dmg
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: downloads/macos/
          retention-days: 1
