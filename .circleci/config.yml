version: 2.1

orbs:
  docker: circleci/docker@2.2.0

jobs:
  build-and-publish:
    docker:
      - image: cimg/base:2023.03
    environment:
      DOCKER_REPOSITORY: azukaar/plurality
      # You can change this to another registry if needed
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
          # Default Docker on CircleCI ships buildx; pin if you ever see it
          # disappear: `version: "24.0.9"` or newer.

      - run:
          name: Generate Version Info
          # Using the short Git commit hash
          command: |
            GIT_HASH=$(git rev-parse --short HEAD)
            echo "{\"version\": \"$GIT_HASH\"}" > version.json
            echo "Generated version.json with version: $GIT_HASH"

      # Register QEMU handlers so the remote Docker daemon can run arm64
      # build steps via emulation, then create a buildx builder.
      - run:
          name: Set up QEMU + buildx
          command: |
            docker run --privileged --rm tonistiigi/binfmt --install all
            docker buildx create --use --name multiarch --driver docker-container
            docker buildx inspect --bootstrap

      # Log in BEFORE the build, because buildx multi-arch builds must push
      # straight to the registry (no local image is produced for multi-arch).
      - run:
          name: Log in to Docker Hub
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin

      # Build & push the multi-arch Docker image (linux/amd64 + linux/arm64).
      - run:
          name: Build & push multi-arch Docker image
          # arm64 stages run under QEMU, so this leg is markedly slower than
          # the amd64 leg. If build time becomes a problem, split into two
          # native jobs (amd64 on docker executor, arm64 on resource_class:
          # arm.medium) and join with `docker buildx imagetools create`.
          no_output_timeout: 60m
          command: |
            echo "Building multi-arch image: $DOCKER_REPOSITORY:$CIRCLE_SHA1"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -t "$DOCKER_REPOSITORY:$CIRCLE_SHA1" \
              -t "$DOCKER_REPOSITORY:latest" \
              --push \
              .

      # Optional: Notify about successful deployment
      - run:
          name: Deployment notification
          command: |
            echo "Docker image successfully built and pushed!"
            echo "Image: $DOCKER_REPOSITORY:$CIRCLE_SHA1"
            # Add notification commands here (Slack, email, etc.)

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - build-and-publish:
          # Only run on master branch
          filters:
            branches:
              only: master
          # Uncomment below if you want to run on tags
          # filters:
          #   tags:
          #     only: /^v.*/
          #   branches:
          #     ignore: /.*/
