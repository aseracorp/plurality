version: 2.1

orbs:
  docker: circleci/docker@2.2.0

jobs:
  build-and-publish:
    docker:
      - image: cimg/base:2023.03
    environment:
      DOCKER_REPOSITORY: azukaar/plurality
      # You can change this to another registry if needed
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.14
          docker_layer_caching: true

      # Build the Docker image
      - run:
          name: Build Docker image
          command: |
            echo "Building Docker image: $DOCKER_REPOSITORY:$CIRCLE_SHA1"
            docker build -t $DOCKER_REPOSITORY:$CIRCLE_SHA1 .
            docker tag $DOCKER_REPOSITORY:$CIRCLE_SHA1 $DOCKER_REPOSITORY:latest

      # Optional: Run tests on the built image
      # - run:
      #     name: Run tests
      #     command: |
      #       echo "Running tests on the built image..."
      #       # Add your test commands here, for example:
      #       # docker run --rm $DOCKER_REPOSITORY:$CIRCLE_SHA1 /app/run-tests.sh

      # Log in to Docker Hub
      - run:
          name: Log in to Docker Hub
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # Push the Docker image to Docker Hub
      - run:
          name: Push Docker image
          command: |
            echo "Pushing Docker image to repository..."
            docker push $DOCKER_REPOSITORY:$CIRCLE_SHA1
            docker push $DOCKER_REPOSITORY:latest

      # Optional: Notify about successful deployment
      - run:
          name: Deployment notification
          command: |
            echo "Docker image successfully built and pushed!"
            echo "Image: $DOCKER_REPOSITORY:$CIRCLE_SHA1"
            # Add notification commands here (Slack, email, etc.)

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - build-and-publish:
          # Only run on main branch
          filters:
            branches:
              only: main
          # Uncomment below if you want to run on tags
          # filters:
          #   tags:
          #     only: /^v.*/
          #   branches:
          #     ignore: /.*/
