version: 2.1

orbs:
  docker: circleci/docker@2.2.0

# Multi-arch publishing pipeline:
#   1. build-amd64  — native amd64 build on a docker executor.
#   2. build-arm64  — native arm64 build on the arm.medium machine executor
#                     (avoids QEMU emulation, which made arm64 ~10x slower).
#   3. merge-manifest — stitches the two per-arch tags into a single
#                       multi-arch manifest at :$SHA and :latest.
# Each per-arch job pushes :<sha>-amd64 / :<sha>-arm64 as intermediates; those
# tags remain on the registry as build artifacts but the consumable tags are
# the multi-arch :$SHA and :latest produced by the merge job.

jobs:
  build-amd64:
    docker:
      - image: cimg/base:2023.03
    environment:
      DOCKER_REPOSITORY: azukaar/plurality
      DOCKER_BUILDKIT: "1"
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Log in to Docker Hub
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin

      - run:
          name: Build & push amd64 image
          no_output_timeout: 30m
          command: |
            TAG="$DOCKER_REPOSITORY:$CIRCLE_SHA1-amd64"
            echo "Building native amd64 image: $TAG"
            docker build -t "$TAG" .
            docker push "$TAG"

  build-arm64:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    resource_class: arm.medium
    environment:
      DOCKER_REPOSITORY: azukaar/plurality
      DOCKER_BUILDKIT: "1"
    steps:
      - checkout

      - run:
          name: Log in to Docker Hub
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin

      - run:
          name: Build & push arm64 image
          no_output_timeout: 30m
          command: |
            TAG="$DOCKER_REPOSITORY:$CIRCLE_SHA1-arm64"
            echo "Building native arm64 image: $TAG"
            docker build -t "$TAG" .
            docker push "$TAG"

  merge-manifest:
    docker:
      - image: cimg/base:2023.03
    environment:
      DOCKER_REPOSITORY: azukaar/plurality
    steps:
      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Log in to Docker Hub
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin

      - run:
          name: Assemble multi-arch manifest
          command: |
            echo "Merging per-arch images into multi-arch manifest..."
            docker buildx imagetools create \
              -t "$DOCKER_REPOSITORY:$CIRCLE_SHA1" \
              -t "$DOCKER_REPOSITORY:latest" \
              "$DOCKER_REPOSITORY:$CIRCLE_SHA1-amd64" \
              "$DOCKER_REPOSITORY:$CIRCLE_SHA1-arm64"

      - run:
          name: Deployment notification
          command: |
            echo "Multi-arch image successfully built and pushed!"
            echo "  $DOCKER_REPOSITORY:$CIRCLE_SHA1"
            echo "  $DOCKER_REPOSITORY:latest"

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - build-amd64:
          filters:
            branches:
              only: master
      - build-arm64:
          filters:
            branches:
              only: master
      - merge-manifest:
          requires:
            - build-amd64
            - build-arm64
          filters:
            branches:
              only: master
